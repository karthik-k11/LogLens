<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogLens</title>
</head>
<body>

    <h1>LogLens</h1>
    <p>Upload a log file to analyze it.</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".log,.txt" required>
        <button type="submit">Upload Log</button>
    </form>
    {% if counts %}
        <h2>Log Summary</h2>

        <p>INFO: {{ counts["INFO"] }}</p>
        <p>WARNING: {{ counts["WARNING"] }}</p>
        <p>ERROR: {{ counts["ERROR"] }}</p>
        <p>DEBUG: {{ counts["DEBUG"] }}</p>
    {% endif %}

</body>
</html>
